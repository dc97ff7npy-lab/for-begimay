<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Эксклюзивное послание ✨</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="magic-container" id="magicContainer"></div>

   <!-- Элемент для воспроизведения музыки -->
   <!-- Музыка Jax - Түнку саат эки загружена прямо на хостинг -->
   <!-- Атмосферный трек Jax - Түнку саат эки по прямой ссылке -->
    <audio id="bgMusic" src="https://mubert.me/files/jax_tunku_saat_eki.mp3" loop></audio>
    <div class="container">
        <!-- Обертка для 3D наклона мыши -->
        <div class="heart-wrapper" id="tiltContainer">
            <div class="heart" id="mainHeart">
                <div class="name-text" id="friendName">Бегимай</div>
            </div>
        </div>
        
        <div class="message-card">
            <p class="message">Ты заслуживаешь всего самого лучшего! 💖</p>
            <span class="subtext">Сделано с душой специально для тебя</span>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
